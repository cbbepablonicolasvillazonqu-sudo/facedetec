# PostgreSQL local para el evento:  docker compose up -d
# Solo escucha en 127.0.0.1: los vectores faciales no deben salir de la laptop.
# La contraseña por defecto es solo para uso local; cámbiala con POSTGRES_PASSWORD.
services:
  postgres:
    image: postgres:16-alpine
    container_name: facedetec-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: facedetec
      POSTGRES_USER: facedetec
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-facedetec_local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - facedetec-data:/var/lib/postgresql/data
      # Se aplica automáticamente solo al crear el volumen por primera vez.
      - ./db/postgres.sql:/docker-entrypoint-initdb.d/01-esquema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U facedetec -d facedetec"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  facedetec-data:
